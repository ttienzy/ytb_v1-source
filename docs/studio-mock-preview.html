<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#f6f7fb; --surface:#fff; --surface-2:#f8f9fc;
    --ink:#30394b; --muted:#9aa5b5; --muted-2:#6b7280;
    --border:#e8ecf2; --border-2:#e3e8f0;
    --accent:#4f46e5; --accent-soft:#e0e7ff; --accent-ink:#4338ca;
    --success:#16a34a; --success-soft:#dcfce7; --success-ink:#15803d;
    --warn:#b54708; --warn-soft:#fff7ed; --warn-border:#fed7aa;
    --chip:#f1f5f9; --chip-border:#e2e8f0; --chip-ink:#374151;
    --dark-grad:linear-gradient(135deg,#1e293b,#334155);
    --radius:10px; --radius-sm:8px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--ground);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  .page{max-width:820px;margin:0 auto;padding:28px 20px 60px}

  /* shell mimicking the app chrome */
  .shell{display:flex;min-height:100vh}
  .sidebar{width:226px;flex-shrink:0;background:#0f172a;color:#cbd5e1;display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;color:#fff;font-size:14px;margin-bottom:18px}
  .brand .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center}
  .nav-label{font-size:10px;letter-spacing:.08em;color:#64748b;text-transform:uppercase;padding:0 8px;margin:10px 0 6px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#cbd5e1;font-size:13px;background:transparent;border:none;cursor:pointer;width:100%;text-align:left;font-family:inherit}
  .nav-item:hover{background:#1e293b}
  .nav-item.active{background:#312e81;color:#fff}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--border);background:var(--surface)}
  .crumbs{font-size:13px;color:var(--muted-2)}
  .crumbs strong{color:var(--ink)}
  .help{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--muted-2)}
  .content{padding:24px 28px;flex:1}

  .heading{margin-bottom:14px}
  .overline{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);margin:0 0 4px}
  h1{font-size:22px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
  .subtitle{color:var(--muted-2);font-size:13px;margin:0}
  .mock-badge{display:inline-block;margin-top:10px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-border);border-radius:999px}

  .stepper{display:flex;gap:8px;margin:4px 0 18px;flex-wrap:wrap}
  .step{display:flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid var(--border-2);border-radius:var(--radius);background:var(--surface);flex:1;min-width:140px}
  .step .num{display:flex;align-items:center;justify-content:center;width:26px;height:26px;flex-shrink:0;border-radius:50%;font-size:13px;font-weight:700;color:var(--muted);background:#f1f4f9}
  .step .body{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted-2)}
  .step.active{border-color:#c7d2fe;background:#f5f7ff}
  .step.active .num{color:var(--accent);background:var(--accent-soft)}
  .step.active .body{color:var(--accent);font-weight:600}
  .step.running{border-color:#c7d2fe;background:#f5f7ff}
  .step.running .num{color:var(--accent);background:var(--accent-soft)}
  .step.done{border-color:#bbf7d0;background:#f0fdf4}
  .step.done .num{color:var(--success);background:var(--success-soft)}
  .step.done .body{color:var(--success-ink)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-top:18px}
  .card-title{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .ic{width:34px;height:34px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
  .card-title h2{font-size:15px;margin:0}
  .card-title p{font-size:12px;color:var(--muted-2);margin:2px 0 0}
  .card h2+*{margin-top:14px}
  label{display:block;font-size:12px;color:var(--muted-2);margin:14px 0 6px}
  label:first-of-type{margin-top:14px}
  input[type=text],select{width:100%;height:42px;padding:0 12px;border:1px solid #d8dee9;border-radius:var(--radius-sm);font-size:13px;background:var(--surface);color:var(--ink);font-family:inherit}
  input[type=text]:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .file-row{display:flex;align-items:center;gap:12px}
  .file-row input[type=file]{width:auto;height:42px;padding:0 10px;font-size:12px}
  .file-name{color:var(--muted);font-size:12px}
  .actions{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;font-family:inherit;transition:background .15s}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:not(:disabled):hover{background:#4338ca}
  .btn-ghost{background:var(--surface);color:var(--ink);border-color:#d8dee9}
  .btn-ghost:not(:disabled):hover{background:#f1f5f9}
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.spin{animation:none}}

  .msg{font-size:13px;color:var(--muted-2);margin:12px 0 0}

  .table-wrap{overflow-x:auto;margin-top:12px;border:1px solid var(--border);border-radius:var(--radius)}
  table{width:100%;border-collapse:collapse;font-size:12px;min-width:640px}
  th{text-align:left;padding:9px 12px;background:var(--surface-2);color:var(--muted-2);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid #f1f4f9;color:var(--ink);vertical-align:top}
  tr:last-child td{border-bottom:none}
  td:last-child{color:#4b5563;max-width:320px}
  .tnum{font-variant-numeric:tabular-nums}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;font-size:12px;color:var(--chip-ink);background:var(--chip);border:1px solid var(--chip-border);border-radius:999px}
  .chip.warn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-border)}

  .final{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
  .final-ph{display:flex;align-items:center;justify-content:center;width:120px;height:68px;border-radius:8px;background:var(--dark-grad);color:#fff;flex-shrink:0}
  .final-meta{display:flex;flex-direction:column;gap:2px;flex:1;min-width:120px}
  .final-meta strong{color:var(--ink);font-size:13px}
  .final-meta span{color:var(--muted);font-size:11px}
</style>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="mark">✦</div> Search Studio</div>
    <div class="nav-label">Menu</div>
    <button class="nav-item">▦ Dashboard</button>
    <button class="nav-item active">▶ Studio</button>
    <button class="nav-item">🎙 Voices</button>
    <button class="nav-item">🕑 Lịch sử</button>
    <button class="nav-item">⚙ Cài đặt</button>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumbs">Workspace <span>/</span> <strong>Studio</strong></div>
      <button class="help">?</button>
    </header>
    <div class="content">
      <div class="page" style="padding:0;max-width:none">
        <div class="heading">
          <p class="overline">YouTube Recap</p>
          <h1>Studio</h1>
          <p class="subtitle">Tóm tắt video YouTube + lồng tiếng Việt — pipeline 4 bước.</p>
          <span class="mock-badge">MOCK — xem trước, chưa nối BE</span>
        </div>

        <div class="stepper" id="stepper"></div>
        <div id="stage"></div>
      </div>
    </div>
  </div>
</div>

<script>
const ICONS={
  spark:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>',
  scissors:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>',
  mic:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>',
  film:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/></svg>',
  upload:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>',
  check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  loader:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>',
  play:'<svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  trash:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
};
const SCENES=[
  {scene_title:'Mở đầu',segments:[
    {idx:0,start:'00:00',end:'00:14',duration:14,original_text:'Hey everyone, welcome back to the channel.',vietnamese_vo:'Xin chào mọi người, hoan nghênh chào trở lại với kênh.'},
    {idx:1,start:'00:14',end:'00:32',duration:18,original_text:'Today we look at three underrated tools.',vietnamese_vo:'Hôm nay chúng ta sẽ xem ba công cụ ít người biết.'},
  ]},
  {scene_title:'Nội dung chính',segments:[
    {idx:2,start:'00:40',end:'01:02',duration:22,original_text:'First, this app automates your recap.',vietnamese_vo:'Đầu tiên, ứng dụng này tự động tạo tóm tắt cho bạn.'},
    {idx:3,start:'01:15',end:'01:38',duration:23,original_text:'Second, it clones your voice in seconds.',vietnamese_vo:'Thứ hai, nó nhân bản giọng của bạn trong vài giây.'},
  ]},
];
const VOICES=['Adam','Trúc Ly','Ngọc Huyền','Minh Đức','Giọng review của tôi'];
const OVERSPEED=[3];
const STEPS=[
  {k:'recap',label:'Tạo recap',ic:ICONS.spark},
  {k:'cut',label:'Cắt video',ic:ICONS.scissors},
  {k:'voice',label:'Tạo voice',ic:ICONS.mic},
  {k:'merge',label:'Ghép',ic:ICONS.film},
];
const DONE=['recap_done','cut_done','voice_done','merged'];
const STATE_OF={recap:'recap_done',cut:'cut_done',voice:'voice_done',merge:'merged'};

let state={job:null,yt:'https://www.youtube.com/watch?v=oa4WoU-dm0o',raw:'',voice:'Adam'};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const $=s=>document.querySelector(s);

function segs(){return state.job?state.job.scenes.flatMap(s=>s.segments):[]}
function curDoneIdx(){if(!state.job)return -1;return DONE.indexOf(state.job.status.replace('_running','_done').replace('idle','recap_done'))}
function stepState(k){
  if(!state.job)return 'pending';
  if(state.job.status===k+'_running')return 'running';
  const my=DONE.indexOf(STATE_OF[k]),cur=curDoneIdx();
  if(my<=cur)return 'done';
  if(my===cur+1)return 'active';
  return 'pending';
}

function renderStepper(){
  $('#stepper').innerHTML=STEPS.map((s,i)=>{
    const st=stepState(s.k);
    const num= st==='done'?ICONS.check : st==='running'?`<span class="spin">${ICONS.loader}</span>` : (i+1);
    return `<div class="step ${st}"><div class="num">${num}</div><div class="body">${s.ic}<span>${s.label}</span></div></div>`;
  }).join('');
}

function card(titleIc,title,sub,inner){
  return `<div class="card"><div class="card-title"><div class="ic">${titleIc}</div><div><h2>${title}</h2><p>${sub}</p></div></div>${inner}</div>`;
}

function renderStage(){
  const el=$('#stage');
  if(!state.job){
    el.innerHTML=card(ICONS.upload,'Bước 1 — Tạo recap','Dán link YouTube + tải file transcript (raw.txt). Gemini phân tích → recap.json.',
      `<label>Link YouTube</label>
       <input type="text" id="yt" value="${state.yt}" placeholder="https://www.youtube.com/watch?v=...">
       <label>Transcript (raw.txt)</label>
       <div class="file-row"><input type="file" id="raw" accept=".txt"><span class="file-name">${state.raw||'Chưa chọn file'}</span></div>
       <div class="actions"><button class="btn btn-primary" id="bRecap">${ICONS.spark} Tạo recap</button></div>`);
    $('#yt').oninput=e=>state.yt=e.target.value;
    $('#raw').onchange=e=>{state.raw=e.target.files[0]?.name||'';renderStage();renderStepper()};
    $('#bRecap').onclick=startRecap;
    return;
  }
  const j=state.job; const ss=segs();
  let html=card(ICONS.spark,'recap.json',`${j.scenes.length} scene · ${ss.length} segment · job <span class="mono">${j.job_id}</span>`,
    ss.length===0?`<p class="msg">${j.status==='recap_running'?'Đang phân tích bằng Gemini…':'Chưa có dữ liệu.'}</p>`:
    `<div class="table-wrap"><table>
      <thead><tr><th>#</th><th>Scene</th><th>Bắt đầu</th><th>Kết thúc</th><th>Độ dài</th><th>Vietnamese VO</th></tr></thead>
      <tbody>${j.scenes.flatMap(s=>s.segments.map(g=>`<tr><td class="tnum">${g.idx}</td><td>${s.scene_title}</td><td class="tnum">${g.start}</td><td class="tnum">${g.end}</td><td class="tnum">${g.duration.toFixed(1)}s</td><td>${g.vietnamese_vo}</td></tr>`)).join('')}</tbody>
    </table></div>`);

  const cutSt=stepState('cut');
  html+=card(ICONS.scissors,'Bước 2 — Cắt video','yt-dlp tải 1 lần → FFmpeg cut [start, end] mỗi segment → clip_i.mp4.',
    `<div class="actions"><button class="btn btn-primary" id="bCut" ${cutSt==='done'||cutSt==='running'||stepState('recap')!=='done'?'disabled':''}>${cutSt==='running'?`<span class="spin">${ICONS.loader}</span>`:ICONS.scissors} ${cutSt==='done'?'Đã cắt xong':cutSt==='running'?'Đang cắt…':'Cắt video'}</button></div>
     ${cutSt==='done'?`<div class="chips">${ss.map(s=>`<span class="chip">🎬 clip_${s.idx}.mp4</span>`).join('')}</div>`:''}`);

  const vSt=stepState('voice');
  html+=card(ICONS.mic,'Bước 3 — Tạo voice','Gom vietnamese_vo → /tts/batch → vo_i.wav + atempo sync theo duration_sec.',
    `<label>Chọn giọng</label>
     <select id="vSel" ${vSt==='done'?'disabled':''}>${VOICES.map(v=>`<option ${v===state.voice?'selected':''}>${v}</option>`).join('')}</select>
     <div class="actions"><button class="btn btn-primary" id="bVoice" ${vSt==='done'||vSt==='running'||stepState('cut')!=='done'?'disabled':''}>${vSt==='running'?`<span class="spin">${ICONS.loader}</span>`:ICONS.mic} ${vSt==='done'?'Đã tạo voice xong':vSt==='running'?'Đang tạo voice…':'Tạo voice'}</button></div>
     ${vSt==='done'?`<div class="chips">${ss.map(s=>`<span class="chip ${OVERSPEED.includes(s.idx)?'warn':''}">🔊 vo_${s.idx}.wav${OVERSPEED.includes(s.idx)?' · quá dài':''}</span>`).join('')}</div>`:''}`);

  const mSt=stepState('merge');
  const total=ss.reduce((a,s)=>a+s.duration,0);
  html+=card(ICONS.film,'Bước 4 — Ghép','FFmpeg concat clip_i + vo_i đã sync → final_recap.mp4.',
    `<div class="actions"><button class="btn btn-primary" id="bMerge" ${mSt==='done'||mSt==='running'||stepState('voice')!=='done'?'disabled':''}>${mSt==='running'?`<span class="spin">${ICONS.loader}</span>`:ICONS.film} ${mSt==='merged'?'Đã ghép xong':mSt==='running'?'Đang ghép…':'Ghép video'}</button></div>
     ${mSt==='merged'?`<div class="final"><div class="final-ph">${ICONS.play}</div><div class="final-meta"><strong>final_recap.mp4</strong><span>${ss.length} đoạn · tổng ~${total.toFixed(1)}s</span></div><button class="btn btn-ghost" id="bReset">${ICONS.trash} Bắt đầu lại</button></div>`:''}`);

  el.innerHTML=html;
  const v=$('#vSel'); if(v)v.onchange=e=>state.voice=e.target.value;
  const bc=$('#bCut'); if(bc)bc.onclick=cut;
  const bv=$('#bVoice'); if(bv)bv.onclick=voice;
  const bm=$('#bMerge'); if(bm)bm.onclick=merge;
  const br=$('#bReset'); if(br)br.onclick=reset;
}

function renderAll(){renderStepper();renderStage()}
function setJ(p){state.job={...state.job,...p};renderAll()}

async function startRecap(){
  state.job={job_id:'mock-'+Math.random().toString(36).slice(2,8),youtube_url:state.yt,status:'recap_running',voice_id:state.voice,scenes:[],overspeed:OVERSPEED};
  renderAll(); await wait(900);
  setJ({status:'recap_done',scenes:SCENES});
}
async function cut(){setJ({status:'cut_running'});await wait(1100);setJ({status:'cut_done'})}
async function voice(){setJ({status:'voice_running'});await wait(1300);setJ({status:'voice_done',overspeed:OVERSPEED})}
async function merge(){setJ({status:'merge_running'});await wait(1100);setJ({status:'merged'})}
function reset(){state.job=null;state.raw='';renderAll()}

renderAll();
</script>
