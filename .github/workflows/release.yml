name: Build and Release Desktop App

# Tag `v*` -> build + publish GitHub Release. Chạy tay (workflow_dispatch) -> build + kiểm tra đầy đủ nhưng KHÔNG publish.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

# Bố cục: validate -> (backend-exe | voice-exe | extension | frontend-checks) chạy SONG SONG -> package (+ publish nếu là tag).
# Job nào lỗi thì package (bước 9 phút) không chạy, nên lỗi được báo sớm.
jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release versions
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content Frontend/package.json -Raw | ConvertFrom-Json -AsHashtable).version
          @('Frontend/package-lock.json', 'Extensions/FlowsVeo-Clean/package.json', 'Extensions/FlowsVeo-Clean/package-lock.json', 'Extensions/FlowsVeo-Clean/public/manifest.json', 'Extensions/FlowsVeo-Clean/manifest.json') | ForEach-Object {
            if ((Get-Content $_ -Raw | ConvertFrom-Json -AsHashtable).version -ne $version) { throw "Version mismatch: $_" }
          }
          $releaseTag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $releaseTag) { throw "Tag must match $releaseTag" }
          if (-not (Test-Path "docs/releases/$version.md")) { throw 'Release notes are missing' }
          "tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

  backend-exe:
    name: Backend executable
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache packaged backend executable
        id: cache-backend
        uses: actions/cache@v6
        with:
          path: Backend/dist/backend_server.exe
          key: backend-bin-${{ runner.os }}-${{ hashFiles('Backend/requirements.txt', 'Backend/backend.spec', 'Backend/app/**', 'Backend/run_server.py', 'Backend/prompts/**', 'Backend/resources/**') }}

      - name: Set up Python
        if: steps.cache-backend.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: Backend/requirements.txt

      - name: Build standalone backend executable
        if: steps.cache-backend.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
          cd Backend
          python -m unittest tests.test_watermark_runtime -v
          pyinstaller --noconfirm backend.spec
          if (-not (Test-Path dist\backend_server.exe)) { throw 'backend_server.exe was not created' }

      - uses: actions/upload-artifact@v7
        with:
          name: backend-exe
          path: Backend/dist/backend_server.exe
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  voice-exe:
    name: Voice service executable
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache packaged voice service executable
        id: cache-voice
        uses: actions/cache@v6
        with:
          path: services/voice-service/dist/voice_server.exe
          key: voice-bin-${{ runner.os }}-${{ hashFiles('services/voice-service/pyproject.toml', 'services/voice-service/uv.lock', 'services/voice-service/voice.spec', 'services/voice-service/app/**') }}

      - name: Set up Python
        if: steps.cache-voice.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build voice service executable
        if: steps.cache-voice.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cd services/voice-service
          python -m pip install uv==0.12.5
          uv sync --frozen --group build --group test --python 3.11
          .\.venv\Scripts\python.exe -m unittest discover -s tests -v
          .\.venv\Scripts\python.exe -m PyInstaller --noconfirm voice.spec
          if (-not (Test-Path dist\voice_server.exe)) { throw 'voice_server.exe was not created' }

      - uses: actions/upload-artifact@v7
        with:
          name: voice-exe
          path: services/voice-service/dist/voice_server.exe
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      # ffmpeg dùng cho smoke test lấy từ gói ffmpeg-static (cùng bản sẽ đóng vào app), không cần cài npm cả Frontend.
      - name: Get ffmpeg-static (same build that ships in the app)
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg-static'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $version = ((Get-Content Frontend/package.json -Raw | ConvertFrom-Json).devDependencies.'ffmpeg-static')
          Set-Location $dir
          npm init -y | Out-Null
          npm install "ffmpeg-static@$version" --no-audit --no-fund --loglevel=error
          $ffmpeg = (Resolve-Path (Join-Path $dir 'node_modules\ffmpeg-static\ffmpeg.exe')).Path
          & $ffmpeg -version | Out-Null
          "FFMPEG_SMOKE_PATH=$ffmpeg" >> $env:GITHUB_ENV

      - name: Cache voice model
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/voice-hf-cache
          key: voice-model-${{ runner.os }}-${{ hashFiles('services/voice-service/uv.lock') }}

      - name: Smoke test packaged voice service
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $voiceExe = (Resolve-Path services\voice-service\dist\voice_server.exe).Path
          $env:APP_DATA_DIR = Join-Path $env:RUNNER_TEMP 'voice-smoke-data'
          $env:HF_HOME = Join-Path $env:RUNNER_TEMP 'voice-hf-cache'
          $env:FFMPEG_PATH = $env:FFMPEG_SMOKE_PATH
          $env:HOST = '127.0.0.1'
          $env:PORT = '8001'
          $stdout = Join-Path $env:RUNNER_TEMP 'voice-smoke.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'voice-smoke.stderr.log'
          $voiceProcess = $null
          $health = $null
          try {
            $voiceProcess = Start-Process -FilePath $voiceExe -PassThru -WindowStyle Hidden `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $deadline = (Get-Date).AddMinutes(10)
            do {
              if ($voiceProcess.HasExited) {
                throw "Voice Service exited early with code $($voiceProcess.ExitCode)"
              }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8001/health' -TimeoutSec 5
                if ($health.error) { throw "Voice engine degraded: $($health.error)" }
                if ($health.model_loaded -and $health.ffmpeg_available) { break }
              } catch {
                if ($_.Exception.Message -like 'Voice engine degraded:*') { throw }
              }
              Start-Sleep -Seconds 2
            } while ((Get-Date) -lt $deadline)

            if (-not $health.model_loaded) { throw 'Voice model did not become ready within 10 minutes' }
            if (-not $health.ffmpeg_available) { throw 'FFmpeg was not detected by Voice Service' }
            $previewPayload = @{ text = 'Xin chào' } | ConvertTo-Json
            $previewResp = Invoke-WebRequest -Uri 'http://127.0.0.1:8001/preview' -Method Post -ContentType 'application/json' -Body $previewPayload -TimeoutSec 60
            if ($previewResp.StatusCode -ne 200) { throw "Voice preview endpoint returned HTTP $($previewResp.StatusCode)" }
            Write-Host "Voice smoke test passed: $($health | ConvertTo-Json -Compress) (preview synthesis verified)"
          } finally {
            if ($voiceProcess -and -not $voiceProcess.HasExited) {
              Stop-Process -Id $voiceProcess.Id -Force
              $voiceProcess.WaitForExit()
            }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
          }

  extension:
    name: Flow extension (verify + package)
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Extensions/FlowsVeo-Clean/package-lock.json

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: Extensions/FlowsVeo-Clean/.local/browsers
          key: ext-chromium-${{ runner.os }}-${{ hashFiles('Extensions/FlowsVeo-Clean/package-lock.json') }}

      # verify = build + test (thường và minify) + build release + smoke Chromium headless + zip.
      - name: Install, verify and package
        working-directory: Extensions/FlowsVeo-Clean
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path (Get-Location) '.local/browsers'
          npx playwright install chromium --no-shell
          npm run verify

      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: |
            Extensions/FlowsVeo-Clean/release/*.zip
            Extensions/FlowsVeo-Clean/release/*.sha256
          retention-days: 1
          if-no-files-found: error

  frontend-checks:
    name: Frontend typecheck + tests
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install, typecheck, test
        working-directory: Frontend
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run typecheck
          npm run test:all

  package:
    name: Package installer${{ startsWith(github.ref, 'refs/tags/v') && ' and publish' || ' (dry run, no publish)' }}
    needs: [validate, backend-exe, voice-exe, extension, frontend-checks]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            Frontend/package-lock.json
            Frontend/watermark-runtime/package-lock.json

      - name: Download backend executable
        uses: actions/download-artifact@v8
        with:
          name: backend-exe
          path: Backend/dist

      - name: Download voice service executable
        uses: actions/download-artifact@v8
        with:
          name: voice-exe
          path: services/voice-service/dist

      - name: Install frontend dependencies
        working-directory: Frontend
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci

      - name: Install watermark runtime
        working-directory: Frontend/watermark-runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PLAYWRIGHT_BROWSERS_PATH = '0'
          npm ci
          npx playwright install --only-shell chromium

      - name: Verify release resources
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            'Backend\dist\backend_server.exe',
            'services\voice-service\dist\voice_server.exe',
            'Frontend\node_modules\ffmpeg-static\ffmpeg.exe',
            'Frontend\watermark-runtime\node_modules\@pilio\gemini-watermark-remover\bin\gwr.mjs',
            'Frontend\watermark-runtime\node_modules\sharp\package.json',
            'Frontend\watermark-runtime\node_modules\playwright-core\.local-browsers'
          ) | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Missing release resource: $_" }
          }

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('Frontend/package-lock.json') }}

      - name: Build app (electron-vite)
        working-directory: Frontend
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run build

      - name: Package installer (electron-builder)
        working-directory: Frontend
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npx electron-builder --win nsis --x64 --publish never

      - name: Verify update manifest and installer
        working-directory: Frontend
        run: |
          $ErrorActionPreference = 'Stop'
          $updateManifest = Get-Content 'release\latest.yml' -Raw
          $artifactMatch = [regex]::Match($updateManifest, '(?m)^\s*-\s+url:\s+(.+?)\s*$')
          if (-not $artifactMatch.Success) { throw 'Could not read the installer URL from release\latest.yml' }
          $expectedInstaller = $artifactMatch.Groups[1].Value.Trim().Trim('"', "'")
          if (-not (Test-Path (Join-Path 'release' $expectedInstaller))) {
            throw "Update manifest points to missing installer: $expectedInstaller"
          }
          Write-Host "Verified update artifacts: $expectedInstaller"

      # Smoke end-to-end trên bản đã đóng gói: backend exe + runtime watermark kèm app xử lý một ảnh thật.
      - name: Smoke test packaged backend watermark flow
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          .\.github\scripts\smoke-packaged-watermark.ps1 -AppRoot 'Frontend\release\win-unpacked'

      - name: Download extension package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v8
        with:
          name: extension
          path: Extensions/FlowsVeo-Clean/release

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: ttienzy/ytb_v1
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ needs.validate.outputs.tag }}
          name: CreatorFlow AI ${{ needs.validate.outputs.tag }}
          body_path: docs/releases/${{ needs.validate.outputs.version }}.md
          files: |
            Frontend/release/*.exe
            Frontend/release/latest.yml
            Extensions/FlowsVeo-Clean/release/*.zip
            Extensions/FlowsVeo-Clean/release/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: false
