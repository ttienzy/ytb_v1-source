name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*' # Tự động kích hoạt khi push tag dạng v1.0.0, v1.0.1...
  workflow_dispatch: # Cho phép kích hoạt thủ công từ GitHub Actions UI

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release:
    name: Build Windows Installer & Create GitHub Release
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Release Versions
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content Frontend/package.json -Raw | ConvertFrom-Json -AsHashtable).version
          @('Frontend/package-lock.json', 'Extensions/FlowsVeo-Clean/package.json', 'Extensions/FlowsVeo-Clean/package-lock.json', 'Extensions/FlowsVeo-Clean/public/manifest.json') | ForEach-Object {
            if ((Get-Content $_ -Raw | ConvertFrom-Json -AsHashtable).version -ne $version) { throw "Version mismatch: $_" }
          }
          $releaseTag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $releaseTag) { throw "Tag must match $releaseTag" }
          if (-not (Test-Path "docs/releases/$version.md")) { throw 'Release notes are missing' }
          "tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            Backend/requirements.txt
            services/voice-service/uv.lock

      - name: Install Backend Dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
          pip install pytest pyyaml python-dotenv websockets

      - name: Cache Packaged Backend Executable
        id: cache-backend
        uses: actions/cache@v4
        with:
          path: Backend/dist/backend_server.exe
          key: backend-bin-${{ runner.os }}-${{ hashFiles('Backend/requirements.txt', 'Backend/backend.spec', 'Backend/app/**', 'Backend/run_server.py', 'Backend/prompts/**', 'Backend/resources/**') }}

      - name: Build Standalone Backend Executable
        if: steps.cache-backend.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cd Backend
          python -m unittest tests.test_watermark_runtime -v
          pyinstaller --noconfirm backend.spec
          if (-not (Test-Path dist\backend_server.exe)) { throw 'backend_server.exe was not created' }

      - name: Cache Packaged Voice Service Executable
        id: cache-voice
        uses: actions/cache@v4
        with:
          path: services/voice-service/dist/voice_server.exe
          key: voice-bin-${{ runner.os }}-${{ hashFiles('services/voice-service/pyproject.toml', 'services/voice-service/uv.lock', 'services/voice-service/voice.spec', 'services/voice-service/app/**') }}

      - name: Install Voice Service Dependencies & Build Executable
        if: steps.cache-voice.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cd services/voice-service
          python -m pip install uv==0.12.5
          uv sync --frozen --group build --group test --python 3.11
          .\.venv\Scripts\python.exe -m unittest discover -s tests -v
          .\.venv\Scripts\python.exe -m PyInstaller --noconfirm voice.spec
          if (-not (Test-Path dist\voice_server.exe)) { throw 'voice_server.exe was not created' }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            Frontend/package-lock.json
            Frontend/watermark-runtime/package-lock.json
            Extensions/FlowsVeo-Clean/package-lock.json

      - name: Install Node Dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cd Frontend
          npm ci
          npm run typecheck
          npm test
          npm run test:voices
          npm run test:veo

      - name: Verify and Package Flow Extension
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cd Extensions/FlowsVeo-Clean
          npm ci
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path (Get-Location) '.local/browsers'
          npx playwright install chromium
          npm run verify

      - name: Install and Smoke Test Watermark Runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PLAYWRIGHT_BROWSERS_PATH = '0'
          cd Frontend\watermark-runtime
          npm ci
          npx playwright install --only-shell chromium
          node .\smoke-test.mjs

      - name: Verify Bundled FFmpeg
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $ffmpeg = (Resolve-Path Frontend\node_modules\ffmpeg-static\ffmpeg.exe).Path
          $license = Resolve-Path Frontend\node_modules\ffmpeg-static\LICENSE
          & $ffmpeg -version
          Write-Host "FFmpeg license: $license"

      - name: Cache Voice Model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/voice-hf-cache
          key: voice-model-${{ runner.os }}-${{ hashFiles('services/voice-service/uv.lock') }}

      - name: Smoke Test Packaged Voice Service
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $voiceExe = (Resolve-Path services\voice-service\dist\voice_server.exe).Path
          $env:APP_DATA_DIR = Join-Path $env:RUNNER_TEMP 'voice-smoke-data'
          $env:HF_HOME = Join-Path $env:RUNNER_TEMP 'voice-hf-cache'
          $env:FFMPEG_PATH = (Resolve-Path Frontend\node_modules\ffmpeg-static\ffmpeg.exe).Path
          $env:HOST = '127.0.0.1'
          $env:PORT = '8001'
          $stdout = Join-Path $env:RUNNER_TEMP 'voice-smoke.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'voice-smoke.stderr.log'
          $voiceProcess = $null
          $health = $null
          try {
            $voiceProcess = Start-Process -FilePath $voiceExe -PassThru -WindowStyle Hidden `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $deadline = (Get-Date).AddMinutes(10)
            do {
              if ($voiceProcess.HasExited) {
                throw "Voice Service exited early with code $($voiceProcess.ExitCode)"
              }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8001/health' -TimeoutSec 5
                if ($health.error) { throw "Voice engine degraded: $($health.error)" }
                if ($health.model_loaded -and $health.ffmpeg_available) { break }
              } catch {
                if ($_.Exception.Message -like 'Voice engine degraded:*') { throw }
              }
              Start-Sleep -Seconds 2
            } while ((Get-Date) -lt $deadline)

            if (-not $health.model_loaded) { throw 'Voice model did not become ready within 10 minutes' }
            if (-not $health.ffmpeg_available) { throw 'Bundled FFmpeg was not detected by Voice Service' }
            $previewPayload = @{ text = 'Xin chào' } | ConvertTo-Json
            $previewResp = Invoke-WebRequest -Uri 'http://127.0.0.1:8001/preview' -Method Post -ContentType 'application/json' -Body $previewPayload -TimeoutSec 60
            if ($previewResp.StatusCode -ne 200) { throw "Voice preview endpoint returned HTTP $($previewResp.StatusCode)" }
            Write-Host "Voice smoke test passed: $($health | ConvertTo-Json -Compress) (preview synthesis verified)"
          } finally {
            if ($voiceProcess -and -not $voiceProcess.HasExited) {
              Stop-Process -Id $voiceProcess.Id -Force
              $voiceProcess.WaitForExit()
            }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
          }

      - name: Build and Package Electron App
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @(
            'Backend\dist\backend_server.exe',
            'services\voice-service\dist\voice_server.exe',
            'Frontend\node_modules\ffmpeg-static\ffmpeg.exe',
            'Frontend\watermark-runtime\node_modules\@pilio\gemini-watermark-remover\bin\gwr.mjs',
            'Frontend\watermark-runtime\node_modules\sharp\package.json',
            'Frontend\watermark-runtime\node_modules\playwright-core\.local-browsers'
          ) | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Missing release resource: $_" }
          }
          cd Frontend
          npm run build
          npx electron-builder --win nsis --x64 --publish never
          $updateManifest = Get-Content 'release\latest.yml' -Raw
          $artifactMatch = [regex]::Match($updateManifest, '(?m)^\s*-\s+url:\s+(.+?)\s*$')
          if (-not $artifactMatch.Success) {
            throw 'Could not read the installer URL from release\latest.yml'
          }
          $expectedInstaller = $artifactMatch.Groups[1].Value.Trim().Trim('"', "'")
          if (-not (Test-Path (Join-Path 'release' $expectedInstaller))) {
            throw "Update manifest points to missing installer: $expectedInstaller"
          }
          $blockmapFile = Join-Path 'release' "$expectedInstaller.blockmap"
          if (Test-Path $blockmapFile) {
            Write-Host "Found blockmap artifact: $expectedInstaller.blockmap"
          } else {
            Write-Host "Full installer distribution mode active (differential blockmap skipped for maximum download speed): $expectedInstaller"
          }
          Write-Host "Verified update artifacts: $expectedInstaller"
          $unpackedApp = (Get-ChildItem 'release\win-unpacked\*.exe' | Where-Object { $_.Name -notlike '*Uninstall*' } | Select-Object -First 1).FullName
          if (-not $unpackedApp -or -not (Test-Path $unpackedApp)) {
            throw 'Packaged Electron executable was not found in release\win-unpacked'
          }
          Write-Host "Found unpacked app executable: $unpackedApp"
          $runtimeDir = (Resolve-Path 'release\win-unpacked\resources\watermark-runtime').Path
          $env:ELECTRON_RUN_AS_NODE = '1'
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $runtimeDir 'node_modules\playwright-core\.local-browsers'
          $smokeScript = Join-Path $runtimeDir 'smoke-test.mjs'
          $smokeStdout = Join-Path $env:RUNNER_TEMP 'watermark-packaged-smoke.stdout.log'
          $smokeStderr = Join-Path $env:RUNNER_TEMP 'watermark-packaged-smoke.stderr.log'
          $smokeProcess = Start-Process -FilePath $unpackedApp -ArgumentList ('"' + $smokeScript + '"') `
            -PassThru -Wait -WindowStyle Hidden `
            -RedirectStandardOutput $smokeStdout -RedirectStandardError $smokeStderr
          if (Test-Path $smokeStdout) { Get-Content $smokeStdout }
          if (Test-Path $smokeStderr) { Get-Content $smokeStderr }
          if ($smokeProcess.ExitCode -ne 0) {
            throw "Packaged watermark runtime smoke test failed: $($smokeProcess.ExitCode)"
          }
      - name: Smoke Test Packaged Backend Watermark Flow
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          .\.github\scripts\smoke-packaged-watermark.ps1 `
            -AppRoot 'Frontend\release\win-unpacked'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ttienzy/ytb_v1
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: CreatorFlow AI ${{ steps.version.outputs.tag }}
          body_path: docs/releases/${{ steps.version.outputs.version }}.md
          files: |
            Frontend/release/*.exe
            Frontend/release/latest.yml
            Extensions/FlowsVeo-Clean/release/*.zip
            Extensions/FlowsVeo-Clean/release/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: false
