[project]
name = "voice-service"
version = "0.1.0"
description = "Standalone Vietnamese TTS voice service (VieNeu-TTS) — HTTP API for the Google Search Tools backend"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Internal" }
dependencies = [
    # Torch-free CPU runtime. GPU dependencies are opt-in.
    "vieneu==3.8.1",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "python-multipart==0.0.32",   # multipart upload (ref audio) cho /internal/voices/{id}
    "pydantic-settings==2.15.0",
    "py-cpuinfo==9.0.0",
]

[project.optional-dependencies]
cuda = ["vieneu[cuda]==3.8.1", "transformers==4.57.6"]

[dependency-groups]
test = ["httpx>=0.28,<1"]
build = [
    "pyinstaller==6.22.3",
]

[tool.uv]
# voice-service không phải package phát hành — chỉ là app chạy; uv không build nó.
package = false
